name: Publish HMCL Fork Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fork-release.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.repository == 'Iu-yang1/HMCL'
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned successful CI artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          artifacts=(
            "12262135072 HMCL-3.17.unofficial-d2f0a57.jar"
            "12262095276 HMCL-3.17.unofficial-d2f0a57.exe"
            "12261331258 HMCL-3.17.unofficial-d2f0a57.sh"
            "12262040433 HMCL-3.17.unofficial-d2f0a57.deb"
          )

          for spec in "${artifacts[@]}"; do
            read -r artifact_id filename <<< "$spec"
            # CI uploaded artifacts with actions/upload-artifact@v7 archive: false.
            # The artifact download endpoint therefore returns the original file
            # bytes, not a ZIP wrapper: a JAR itself is already a ZIP archive.
            curl --fail --location --silent --show-error --retry 3 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "dist/$filename"
            test -s "dist/$filename"
          done

          unzip -tq "dist/HMCL-3.17.unofficial-d2f0a57.jar" > /dev/null
          # Validate executable/script/package signatures without executing them.
          [[ "$(head -c 2 dist/HMCL-3.17.unofficial-d2f0a57.exe | od -An -tx1 | tr -d ' \n')" == "4d5a" ]]
          [[ "$(head -c 2 dist/HMCL-3.17.unofficial-d2f0a57.sh)" == "#!" ]]
          ar t dist/HMCL-3.17.unofficial-d2f0a57.deb > /dev/null
          file dist/*
          (
            cd dist
            sha256sum HMCL-3.17.unofficial-d2f0a57.{jar,exe,sh,deb} > SHA256SUMS.txt
          )

          # Only report presence; never print a private credential.
          if unzip -p "dist/HMCL-3.17.unofficial-d2f0a57.jar" assets/hmcl.properties \
             | grep -qE '^hmcl\.curseforge\.apikey=.+$'; then
            echo "::warning::A CurseForge API credential is embedded in the public release artifact."
          else
            echo "::error::CurseForge API credential missing from intended release artifact."\n            exit 1
          fi

      - name: Create public pre-release from pinned artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="fork-v3.17.unofficial-d2f0a57"
          source_sha="d2f0a5788b93d6a3c3b754133692377d3e71956c"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Refusing to overwrite."
            exit 1
          fi

          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<'NOTES'
          ## HMCL independent fork — pre-release

          Source commit: https://github.com/Iu-yang1/HMCL/commit/d2f0a5788b93d6a3c3b754133692377d3e71956c
          Build: https://github.com/Iu-yang1/HMCL/actions/runs/39413490318/attempts/2

          This is an **unofficial community fork**, not an official HMCL or CurseForge release. This is a NEW Release, distinct from the earlier 3cb91d3 build.

          - Mainland China game and add-on download UI is available again.
          - Launcher self-update checking against the upstream distribution is disabled.
          - Four downloadable binary formats: JAR, Windows EXE, SH, Debian DEB.
          - SHA256SUMS.txt provides SHA-256 hashes for all published files.

          **Credential notice:** Existing CI artifacts are being published with the repository owner's explicit authorization. The build may contain an embedded CurseForge API Key, which, if configured, is extractable from public clients. GitHub Secrets do not protect any Key once embedded into public artifacts. Rotate or revoke this Key if it should not be public.

          **Authentication notice:** Successful CI compilation does not validate Microsoft/Xbox/Minecraft login. The earlier client logs contained HTTP 429 rate limiting and an XSTS authorization exception; those issues are not fixed in these artifacts.
          NOTES

          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$source_sha" \
            --title "HMCL Fork 3.17 unofficial (d2f0a57 — CurseForge enabled)" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json name,url,isPrerelease,tagName,assets
